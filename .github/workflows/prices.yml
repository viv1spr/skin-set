name: Update skin prices
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node admin/build-extra.js
      - run: node admin/fetch-prices.js
      - run: node admin/build.js
      - run: python3 admin/catalog.py --data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Price history (branch "history") + market page
        run: |
          git clone -q --depth 1 -b history "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/hist || mkdir -p /tmp/hist
          python3 admin/price_history.py --dir /tmp/hist
          python3 admin/market_page.py --dir /tmp/hist
          cd /tmp/hist && rm -rf .git && git init -q && git checkout -q -b history && git add . \
            && git -c user.name=price-bot -c user.email=bot@skin-set.com commit -qm "price history $(date -u +%FT%H:%M)" \
            && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" history
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "bot@skin-set.com"
          git add data blog en/blog de/blog pt/blog tr/blog pl/blog sitemap.xml rynok-cs2 en/cs2-market
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
