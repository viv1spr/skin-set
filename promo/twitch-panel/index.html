<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000}
.cv{position:relative;width:640px;height:1200px;overflow:hidden;color:#fff;font-family:'Roboto Condensed',sans-serif;
background:radial-gradient(520px 420px at 0% 30%,rgba(138,92,246,.35),transparent 62%),radial-gradient(520px 420px at 100% 80%,rgba(232,64,42,.4),transparent 62%),linear-gradient(180deg,#0e1018,#06070b)}
.cv::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 85%)}
.cv::after{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#7fb2ff,#8a5cf6,#e8402a,#ffd36a)}
.in{position:relative;z-index:1;padding:56px 36px 0;display:flex;flex-direction:column;height:100%}
.lg{display:flex;align-items:center;justify-content:center;gap:12px;font:700 44px/1 Oswald;font-style:italic;letter-spacing:.04em}
.lg svg{width:48px;height:48px}
h1{margin:26px 0 0;text-align:center;font:700 70px/.95 Oswald;text-transform:uppercase}
h1 span{display:block;background:linear-gradient(90deg,#7fb2ff,#c9a6ff 45%,#ffd36a);-webkit-background-clip:text;background-clip:text;color:transparent}
.rows{margin-top:38px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:linear-gradient(90deg,var(--g),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-left:5px solid var(--c)}
.bud{width:150px;flex:none}
.bud small{display:block;font:600 16px/1 Oswald;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.bud b{display:block;margin-top:8px;font:700 33px/1 Oswald;color:var(--c);white-space:nowrap}
.its{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{height:96px;border-radius:12px;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.08),transparent 70%),rgba(8,9,13,.6);display:grid;place-items:center;overflow:hidden}
.it img{width:118%;height:118%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.7))}
.s{margin-top:30px;text-align:center;font:500 27px/1.3 'Roboto Condensed';color:#d4cfc3}
.cta{margin:auto 4px 56px;height:104px;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:18px;background:linear-gradient(180deg,#ff5a3d,#e8402a);box-shadow:0 14px 40px rgba(232,64,42,.45);font:700 46px/1 Oswald;letter-spacing:.03em}
h1 span{font-size:.86em;white-space:nowrap;margin-top:4px}.rows{gap:24px;margin-top:44px}.it{height:118px}.row{padding:18px 16px}.s{margin-top:40px}</style></head><body><div class="cv"><div class="in">
