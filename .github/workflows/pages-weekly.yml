name: Rebuild skin wiki and SEO pages
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 admin/skins_wiki.py
      - run: python3 admin/budget_pages.py
      - run: python3 admin/color_pages_ru.py
      - run: python3 admin/color_pages_i18n.py
      - run: python3 admin/price_pages.py
      - run: python3 admin/skin_images.py
      - run: python3 admin/noshop.py
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "bot@skin-set.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly rebuild: skin wiki and SEO pages $(date -u +%F)"
          git pull --rebase -X theirs || true
          git push
