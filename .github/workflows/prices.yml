name: Update skin prices
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node admin/build-extra.js
      - run: node admin/fetch-prices.js
      - run: node admin/build.js
      - run: python3 admin/catalog.py --data
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "bot@skin-set.com"
          git add data blog en/blog de/blog pt/blog tr/blog pl/blog sitemap.xml
          git diff --cached --quiet || git commit -m "Update prices $(date -u +%F)"
          git push
